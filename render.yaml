# Render Blueprint for the Outpass Portal backend.
# Database is an EXTERNAL managed MySQL (Aiven / Railway / Clever Cloud) — not defined here.
# Fill the sync:false secrets in the Render dashboard after the first deploy.
services:
  - type: web
    name: outpass-portal-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: REQUIRED
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://outpass-portal.vercel.app
