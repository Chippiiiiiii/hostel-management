spring.application.name=portal

# =====================================================
# DATABASE CONFIGURATION
# =====================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:outpass_portal}?sslMode=${DB_SSL_MODE:DISABLED}&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# =====================================================
# JPA / HIBERNATE CONFIGURATION
# =====================================================
# WARNING: 'update' is fine for development but DANGEROUS in production — use 'validate' or 'none' there.
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (set to false in production)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Hibernate dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Naming strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Second-level cache
spring.jpa.properties.hibernate.cache.use_second_level_cache=false

# Batch processing
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =====================================================
# JWT CONFIGURATION
# =====================================================
# JWT Secret Key (loaded from .env file)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
# JWT Access Token Expiration (30 minutes in milliseconds). Kept short deliberately: since
# logout/account-disable/password-change only revoke refresh tokens (JwtAuthenticationFilter
# re-checks the DB `enabled` flag live for Warden/SecurityGuard, but Student/Admin have no such
# flag), a still-valid access token issued just before one of those events remains usable until
# it naturally expires. Refresh-token rotation (see RefreshTokenService/AuthService) makes a
# short TTL here transparent to the user -- the frontend's axios interceptor (api.js) silently
# refreshes on the first 401 -- so this is not a UX tradeoff, only a security one.
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:1800000}

# JWT Refresh Token Expiration (7 days in milliseconds)
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# JWT Issuer
jwt.issuer=${JWT_ISSUER:outpass-portal}

# =====================================================
# SECURITY CONFIGURATION
# =====================================================
# BCrypt password encoding strength
spring.security.password.strength=10

# =====================================================
# SERVER CONFIGURATION
# =====================================================
# Server port (Render injects PORT automatically; falls back to SERVER_PORT then 8080)
server.port=${PORT:${SERVER_PORT:8080}}

# Context path
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}

# Resolve the real client IP from X-Forwarded-For via the embedded container's own
# trusted-proxy handling (Tomcat's RemoteIpValve), instead of trusting the header
# blindly in application code. Needed for per-IP rate limiting (login, forgot-password,
# etc.) and for the WiFi-subnet attendance check to see the student's real IP.
#
# Trust boundary (audited 2026-09-04): RemoteIpValve only honors X-Forwarded-For from an
# immediate TCP peer whose address matches its internalProxies regex (private/loopback
# ranges by default), and even then only takes the right-most entry outside that range --
# a client-supplied "X-Forwarded-For: 10.0.0.1" cannot spoof this. This is safe as long as
# the assumption below holds; if it stops holding, treat X-Forwarded-For as untrusted
# again (drop this setting, or configure explicit internalProxies to Render's exact
# edge range) rather than assuming it's still safe:
#   ASSUMPTION: this service is a Render "web" (Docker) service (see render.yaml) —
#   Render's platform does not expose the container directly to the internet; all
#   inbound traffic is terminated and forwarded by Render's own edge/load balancer over
#   Render's internal network. If this service is ever deployed such that it can receive
#   connections directly from arbitrary internet clients (e.g. a different host, a
#   different platform, or a NodePort/LoadBalancer exposing the container port directly),
#   this trust assumption breaks and X-Forwarded-For becomes spoofable.
server.forward-headers-strategy=native

# =====================================================
# LOGGING CONFIGURATION
# =====================================================
# Log levels are overridable via env vars (relaxed binding), e.g. LOGGING_LEVEL_COM_OUTPASS_PORTAL=DEBUG
logging.level.root=INFO
logging.level.com.outpass.portal=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:INFO}

# Log to stdout only. Render captures the log stream; the container filesystem is ephemeral,
# so a rolling file would be lost on every restart. Enable a file locally by setting LOG_FILE.
logging.file.name=${LOG_FILE:}

# Log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# =====================================================
# VALIDATION CONFIGURATION
# =====================================================
spring.web.resources.add-mappings=false

# =====================================================
# JACKSON CONFIGURATION
# =====================================================
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.default-property-inclusion=non_null

# =====================================================
# EMAIL CONFIGURATION (uses Brevo HTTP API — no SMTP needed)
# =====================================================
brevo.api.key=${BREVO_API_KEY:}
app.mail.from.email=${MAIL_FROM_EMAIL:noreply@hostel.app}
app.mail.from.name=${MAIL_FROM_NAME:Hostel Management}

# Frontend URL (used for links in emails)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# =====================================================
# RATE LIMITING CONFIGURATION
# =====================================================
# Different limits for different operation types
# CREATE: Outpass creation (10 per hour prevents spam, allows legitimate use)
# UPDATE: Profile updates, status changes (20 per hour)
# READ: Viewing data (200 per minute - very lenient for browsing)

# For 2000+ users during holidays:
# - Students can create up to 10 outpasses per hour (enough for editing/resubmitting)
# - Students can view their data 200 times per minute (no browsing restrictions)
# - Update operations limited to 20 per hour (profile changes, etc.)

# Unauthenticated auth/email endpoints (no logged-in user, so keyed by client IP
# and, where a target email is present, IP + normalized email). Protects against
# email bombing, verification-token brute forcing, and mass account creation.
rate.limit.auth.forgot-password=${RATE_LIMIT_FORGOT_PASSWORD:3}
rate.limit.auth.resend-verification=${RATE_LIMIT_RESEND_VERIFICATION:3}
rate.limit.auth.register=${RATE_LIMIT_REGISTER:5}
rate.limit.auth.verify-email=${RATE_LIMIT_VERIFY_EMAIL:20}
rate.limit.auth.window-seconds=${RATE_LIMIT_AUTH_WINDOW_SECONDS:3600}

# Login endpoints (student/warden/security/admin all share this): two independent
# sliding-window buckets over the same window-seconds above.
#   - login: keyed by IP + normalized email -- bounds attempts against one targeted account.
#   - login-ip: keyed by IP alone (higher ceiling) -- bounds credential-stuffing sweeps
#     across many different accounts from a single IP, which the per-account bucket
#     above wouldn't catch since a fresh email opens a fresh bucket.
# Neither bucket is role-specific, so switching between /auth/student/login,
# /auth/warden/login, /auth/security/login, /auth/admin/login for the same
# email+IP shares the same counters and cannot be used to bypass the limit.
rate.limit.auth.login=${RATE_LIMIT_LOGIN:10}
rate.limit.auth.login-ip=${RATE_LIMIT_LOGIN_IP:30}
# /auth/refresh has no email to key on (only an opaque refresh token) -- IP-keyed only,
# with a generous ceiling since legitimate clients call this automatically on every
# expired access token across possibly several open tabs/devices.
rate.limit.auth.refresh=${RATE_LIMIT_REFRESH:60}
# /auth/reset-password has no email either (only the reset token) -- IP-keyed only.
rate.limit.auth.reset-password=${RATE_LIMIT_RESET_PASSWORD:10}

# =====================================================
# LOGIN FAILURE BACKOFF (per-account, IP-independent)
# =====================================================
# Complements the IP-keyed rate limits above: tracks CONSECUTIVE failed logins per
# normalized email (never per-IP), so an attacker can't dodge it by rotating IPs or by
# trying the same email across the different role-specific login endpoints. Below
# `threshold` failures, behavior is unchanged; from `threshold` on, each further
# failure doubles the throttle window (base-seconds, base-seconds*2, *4, ... capped at
# max-seconds), reset to zero on the next successful login. This is a temporary
# throttle, never a permanent lockout -- the account always recovers once the window
# elapses, with no admin action required.
security.login-backoff.enabled=${LOGIN_BACKOFF_ENABLED:true}
security.login-backoff.threshold=${LOGIN_BACKOFF_THRESHOLD:5}
security.login-backoff.base-seconds=${LOGIN_BACKOFF_BASE_SECONDS:30}
security.login-backoff.max-seconds=${LOGIN_BACKOFF_MAX_SECONDS:900}

# Daily cleanup of expired email-verification / password-reset / refresh tokens.
# Cron format: second minute hour day month weekday. Default: 3 AM Asia/Kolkata.
token.cleanup.cron=${TOKEN_CLEANUP_CRON:0 0 3 * * *}

